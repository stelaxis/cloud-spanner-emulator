name: Emulator image

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*-stx.*']

permissions: {}

env:
  # Generated C++ files can exceed 5 GiB each. Four workers can OOM 16 GiB;
  # leave room for Bazel, linking, and the OS. Keep every cache producer aligned.
  BAZEL_JOBS: '2'

defaults:
  run:
    shell: bash

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rpc-deps:
    name: RPC dependencies (${{ matrix.arch }})
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Record disk space before build
        run: |
          { echo '### Before build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Checkpoint gRPC and protobuf
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: rpc-deps
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-to: type=local,dest=${{ runner.temp }}/rpc-cache,mode=max,compression=zstd
      - name: Upload complete RPC cache
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/rpc-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Record disk space after build
        if: always()
        timeout-minutes: 2
        run: |
          { echo '### After build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deps:
    name: GoogleSQL dependencies (${{ matrix.arch }})
    needs: rpc-deps
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Record disk space before build
        run: |
          { echo '### Before build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Download complete RPC cache
        timeout-minutes: 20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpc-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/rpc-cache
      - name: Verify RPC cache handoff
        run: test -s "$RUNNER_TEMP/rpc-cache/index.json"
      - name: Checkpoint GoogleSQL value before compiling analyzer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps-value
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/rpc-cache
      - name: Checkpoint GoogleSQL parser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps-parser
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/rpc-cache
      - name: Checkpoint GoogleSQL resolved AST
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps-resolved-ast
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/rpc-cache
      - name: Checkpoint GoogleSQL resolver
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps-resolver
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/rpc-cache
      - name: Checkpoint GoogleSQL before compiling the emulator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=local,src=${{ runner.temp }}/rpc-cache
          cache-to: type=local,dest=${{ runner.temp }}/deps-cache,mode=max,compression=zstd
      - name: Upload complete GoogleSQL cache
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Record disk space after build
        if: always()
        timeout-minutes: 2
        run: |
          { echo '### After build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.arch }})
    needs: deps
    # Required checks must fail, rather than be skipped, if a checkpoint fails.
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Require successful dependency checkpoints
        env:
          DEPS_RESULT: ${{ needs.deps.result }}
        run: test "$DEPS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Record disk space before build
        run: |
          { echo '### Before build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Download complete GoogleSQL cache
        timeout-minutes: 20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/deps-cache
      - name: Verify GoogleSQL cache handoff
        run: test -s "$RUNNER_TEMP/deps-cache/index.json"
      # Native runners only: do not install QEMU. Import the complete current-run
      # dependency layers, including the Bazel outputs in /root/.cache/bazel.
      - name: Build native image
        timeout-minutes: ${{ matrix.arch == 'amd64' && 240 || 300 }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          tags: emulator:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/stelaxis/cloud-spanner-emulator
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/emulator-${{ matrix.arch }}.tar
          cache-from: type=local,src=${{ runner.temp }}/deps-cache
      - name: Smoke-test native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker load --input "$RUNNER_TEMP/emulator-$ARCH.tar"
          docker run --detach --name emulator --publish 127.0.0.1:9020:9020 "emulator:ci-$ARCH"
          trap 'docker logs emulator; docker rm --force emulator' EXIT
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 10 localhost:9020/v1/projects/test/instances
      - name: Export compiled amd64 test builder
        if: matrix.arch == 'amd64'
        timeout-minutes: 40
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: test-builder
          platforms: linux/amd64
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          tags: emulator:tests
          outputs: type=docker,dest=${{ runner.temp }}/test-builder.tar
      - name: Compress test builder handoff
        if: matrix.arch == 'amd64'
        timeout-minutes: 15
        run: |
          gzip -1 "$RUNNER_TEMP/test-builder.tar"
          du -h "$RUNNER_TEMP/test-builder.tar.gz" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compiled amd64 test builder
        if: matrix.arch == 'amd64'
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-builder-amd64
          path: ${{ runner.temp }}/test-builder.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      # Only runtime images cross into the publishing job; no registry token is
      # available to either the Docker build or pull-request code.
      - name: Upload runtime image
        if: github.event_name == 'push'
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-${{ matrix.arch }}
          path: ${{ runner.temp }}/emulator-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record disk space after build
        if: always()
        timeout-minutes: 2
        run: |
          { echo '### After build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  test-shards:
    name: Tests (${{ matrix.area }})
    needs: build
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      # Disjoint areas plus a complement preserve the upstream suite, including
      # tests added in new packages. Keep the PostgreSQL src exclusion.
      matrix:
        include:
          - area: backend-query
            targets: //backend/query/...
          - area: backend-schema
            targets: //backend/schema/...
          - area: backend-other
            targets: //backend/... -//backend/query/... -//backend/schema/...
          - area: frontend
            targets: //frontend/...
          - area: conformance
            targets: //tests/conformance/...
          - area: postgres-functions
            targets: //third_party/spanner_pg/function_evaluators/...
          - area: postgres-other
            targets: >-
              //third_party/spanner_pg/...
              -//third_party/spanner_pg/src/...
              -//third_party/spanner_pg/function_evaluators/...
          - area: remaining
            targets: >-
              //... -//backend/... -//frontend/...
              -//tests/conformance/... -//third_party/spanner_pg/...
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Record disk space before build
        run: |
          { echo '### Before build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Loading an artifact cannot trigger compilation or cache-miss fallbacks.
      - name: Download compiled amd64 test builder
        timeout-minutes: 20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-builder-amd64
          path: ${{ runner.temp }}/test-builder
      - name: Load compiled amd64 test builder
        timeout-minutes: 30
        run: docker load --input "$RUNNER_TEMP/test-builder/test-builder.tar.gz"
      - name: Record disk space after loading builder
        run: |
          { echo '### After loading test builder'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run upstream shard inside builder
        id: tests
        # 20 min download + 30 load + 285 tests leaves 25 min for setup/logs.
        timeout-minutes: 285
        env:
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          read -r -a targets <<< "$TEST_TARGETS"
          docker run --name emulator-tests \
            emulator:tests bazel test -c opt --jobs="$BAZEL_JOBS" \
              --test_output=errors --nocache_test_results \
              -- "${targets[@]}" \
            2>&1 | tee "$RUNNER_TEMP/bazel-test-console.log"
      - name: Record disk space after tests
        if: always()
        timeout-minutes: 2
        run: |
          { echo '### After tests (before cleanup)'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect logs and release the test container
        if: always() && steps.tests.outputs.started == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-testlogs"
          if docker container inspect emulator-tests > /dev/null 2>&1; then
            docker stop --time 30 emulator-tests || true
            docker cp -L emulator-tests:/src/bazel-testlogs/. "$RUNNER_TEMP/bazel-testlogs" || true
            docker rm --force emulator-tests
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/bazel-testlogs"
      - name: Upload failure logs
        if: failure() || cancelled()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs-${{ matrix.area }}
          path: |
            ${{ runner.temp }}/bazel-testlogs
            ${{ runner.temp }}/bazel-test-console.log
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Upstream unit and conformance tests
    needs: test-shards
    # A failed/skipped matrix must fail this required check, not skip it.
    if: ${{ always() && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success

  publish:
    name: Publish multi-arch image
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.repository == 'stelaxis/cloud-spanner-emulator'
    needs: [build, unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # Publish the tested images and multi-arch manifest to GHCR.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emulator-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architectures and assemble manifest
        run: |
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/emulator-$arch.tar"
            # Unique staging tags avoid collisions between concurrent releases.
            staging="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "emulator:ci-$arch" "$staging"
            docker push "$staging"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Registry did not return a SHA-256 manifest digest.'
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create \
            --tag "$IMAGE:edge" --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" "${sources[@]}"

  release:
    name: Promote tested image to release tag
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'stelaxis/cloud-spanner-emulator'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # Retag the already-tested registry manifest without running repository code.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote the tested SHA
        run: |
          source="$IMAGE:sha-${GITHUB_SHA:0:7}"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}'); then
            echo '::error::The tested SHA image is missing. Wait for its master build to publish, then rerun this job.'
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Registry did not return a SHA-256 manifest digest.'
            exit 1
          fi
          source="$IMAGE@$digest"
          docker buildx imagetools create --dry-run "$source" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          # Check the full revision too, rather than trusting a short-SHA match.
          while read -r platform_digest; do
            docker buildx imagetools inspect "$IMAGE@$platform_digest" --format '{{json .Image}}' \
              | jq --exit-status --arg sha "$GITHUB_SHA" '.config.Labels["org.opencontainers.image.revision"] == $sha'
          done < <(jq -r '.manifests[].digest' "$RUNNER_TEMP/manifest.json")
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$source"
