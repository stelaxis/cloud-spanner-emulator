name: Emulator image

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*-stx.*']
  workflow_dispatch:

permissions: {}

env:
  TOOLCHAIN_IMAGE: emulator-toolchain:ci
  # Repository variables, not secrets. Unset, CI builds cold without a remote cache.
  BAZEL_CACHE_BUCKET: ${{ vars.BAZEL_CACHE_BUCKET }}
  # Only master pushes and dispatches on master upload, as the writer service
  # account, which IAM lets only the master ref impersonate. Every other run reads
  # as the reader service account. No Bazel job may use an `environment:`: that
  # changes the OIDC subject and breaks the master-only binding.
  BAZEL_CACHE_WRITE: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

defaults:
  run:
    shell: bash

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-amd64:
    name: Build (amd64)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the Bazel remote cache.
    env:
      ARCH: amd64
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # google-github-actions/auth writes its credentials file to the workspace
          # root; keep it out of the source tree that Bazel and Docker see.
          path: src
      - &free-disk
        name: Free disk for Bazel intermediates
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          mkdir -p "$RUNNER_TEMP/handoff/disk-cache"
      - &disk-before
        name: Record disk space before build
        run: |
          { echo '### Before build'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - &setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      # Built once per run: every Bazel job of this architecture loads this exact
      # image, so all of them derive the same cache-silo key.
      - name: Build toolchain image
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/build/docker/Dockerfile.ubuntu
          # Adds the pinned Google Cloud CLI that the test shards need.
          target: test-toolchain
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.TOOLCHAIN_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/handoff/toolchain.tar
      - &load-toolchain
        name: Load toolchain image
        timeout-minutes: 10
        run: docker load --input "$RUNNER_TEMP/handoff/toolchain.tar"
      - &gcp-auth
        name: Authenticate to the Bazel remote cache
        id: gcp
        # The writer on upload runs, the reader otherwise; if that one is unset,
        # the run builds cold. Fork PRs never receive credentials.
        if: >-
          vars.BAZEL_CACHE_BUCKET != '' && vars.GCP_WIF_PROVIDER != ''
          && (env.BAZEL_CACHE_WRITE == 'true' && vars.GCP_CACHE_SERVICE_ACCOUNT != ''
              || env.BAZEL_CACHE_WRITE != 'true' && vars.GCP_CACHE_READER_SERVICE_ACCOUNT != '')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          # The `if:` above guarantees the selected account is set.
          service_account: ${{ env.BAZEL_CACHE_WRITE == 'true' && vars.GCP_CACHE_SERVICE_ACCOUNT || vars.GCP_CACHE_READER_SERVICE_ACCOUNT }}
          export_environment_variables: false
      # Bazel runs in the toolchain container at /src with a fixed output base, so
      # cache keys match across jobs and runs.
      - &start-bazel
        name: Start Bazel in the toolchain container
        env:
          CREDENTIALS: ${{ steps.gcp.outputs.credentials_file_path }}
        run: |
          mkdir -p "$RUNNER_TEMP/output-base" "$RUNNER_TEMP/build-root" "$RUNNER_TEMP/bazel-testlogs"
          key=$(docker run --rm "$TOOLCHAIN_IMAGE" cat /etc/bazel-toolchain-key)
          # Bazel reads /etc/bazel.bazelrc before the workspace .bazelrc. The disk
          # cache carries this run's local results to later jobs.
          rc="$RUNNER_TEMP/bazel.bazelrc"
          {
            echo 'build --disk_cache=/bazel-disk-cache'
            echo "build --remote_default_exec_properties=cache-silo-key=$key"
          } > "$rc"
          mounts=(
            --volume "$GITHUB_WORKSPACE/src:/src"
            --volume "$RUNNER_TEMP/output-base:/root/.cache/bazel"
            --volume "$RUNNER_TEMP/handoff/disk-cache:/bazel-disk-cache"
            --volume "$RUNNER_TEMP/build-root:/build-root"
            --volume "$RUNNER_TEMP/bazel-testlogs:/testlogs"
            --volume "$rc:/etc/bazel.bazelrc:ro"
          )
          if [[ -n "$CREDENTIALS" ]]; then
            {
              echo "build --remote_cache=https://storage.googleapis.com/$BAZEL_CACHE_BUCKET"
              echo 'build --google_credentials=/gcp-credentials.json'
            } >> "$rc"
            mounts+=(--volume "$CREDENTIALS:/gcp-credentials.json:ro")
            if [[ "$BAZEL_CACHE_WRITE" == true ]]; then
              mode="read-write as the writer, gs://$BAZEL_CACHE_BUCKET"
            else
              # The reader cannot write anyway; this keeps Bazel from trying.
              echo 'build --noremote_upload_local_results' >> "$rc"
              mode="read-only as the reader, gs://$BAZEL_CACHE_BUCKET"
            fi
          else
            mode='off, cold build'
            if [[ -n "$BAZEL_CACHE_BUCKET" ]]; then
              echo '::warning::No cache credentials for this run (fork PR or an unset GCP_* variable); building cold.'
            fi
          fi
          docker run --detach --init --name bazel --workdir /src "${mounts[@]}" \
            "$TOOLCHAIN_IMAGE" sleep infinity
          # The same edit as the Dockerfile build stage.
          docker exec bazel find third_party/spanner_pg -name nodes.h \
            -exec sed -i 's/enum NodeTag : int/enum NodeTag/g' {} +
          {
            echo "### Bazel remote cache: $mode"
            echo "Cache-silo key \`$key\` from:"
            echo '```text'
            docker exec bazel cat /etc/bazel-toolchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - &build-binaries
        name: Build emulator binaries
        timeout-minutes: 300
        run: |
          docker exec bazel bazel build --config=ci --remote_download_toplevel \
            //binaries:emulator_main //binaries:gateway_main
          # Flush the disk cache before it is handed off.
          docker exec bazel bazel shutdown
          # Stage exactly the paths the release stage copies from `build`, with the
          # Dockerfile's license loop.
          # shellcheck disable=SC2016
          docker exec bazel bash -euo pipefail -c '
            for file in $(find -L bazel-src/external -name "LICENSE" -o -name "COPYING"); do
              echo "----"; echo $file; echo "----"; cat $file
            done > licenses.txt
            gzip --force licenses.txt
            for path in /src/licenses.txt.gz /src/bazel-bin/binaries/emulator_main \
                /src/bazel-bin/binaries/gateway_main_/gateway_main \
                "/usr/lib/$(gcc -dumpmachine)/libstdc++.so.6"; do
              mkdir -p "/build-root$(dirname "$path")"
              cp --dereference --preserve=mode "$path" "/build-root$path"
            done
          '
      - &upload-handoff
        name: Upload toolchain image and Bazel disk cache
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-handoff-${{ env.ARCH }}
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true
      # Native runners only: do not install QEMU. Nothing compiles here.
      - &build-runtime
        name: Build runtime image from the prebuilt binaries
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/build/docker/Dockerfile.ubuntu
          # A named context replaces the Dockerfile's `build` stage.
          build-contexts: build=${{ runner.temp }}/build-root
          platforms: linux/${{ env.ARCH }}
          provenance: false
          sbom: false
          tags: emulator:ci-${{ env.ARCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/stelaxis/cloud-spanner-emulator
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/emulator-${{ env.ARCH }}.tar
      - &smoke-test
        name: Smoke-test native image
        run: |
          docker load --input "$RUNNER_TEMP/emulator-$ARCH.tar"
          docker run --detach --name emulator --publish 127.0.0.1:9020:9020 "emulator:ci-$ARCH"
          trap 'docker logs emulator; docker rm --force emulator' EXIT
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 10 localhost:9020/v1/projects/test/instances
      # Only runtime images cross into the publishing job; no registry token is
      # available to either the Docker build or pull-request code.
      - &upload-runtime
        name: Upload runtime image
        if: github.event_name == 'push'
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-${{ env.ARCH }}
          path: ${{ runner.temp }}/emulator-${{ env.ARCH }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - &disk-after
        name: Record disk space after build
        if: always()
        timeout-minutes: 2
        run: |
          {
            echo '### After build'
            echo '```text'
            df -h
            du -sh "$RUNNER_TEMP"/handoff/* 2> /dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull requests do not build arm64. Cold, its dependencies and the emulator
  # together exceed one six-hour job, so this job checkpoints the dependencies.
  deps-arm64:
    name: Dependencies (arm64)
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the Bazel remote cache.
    env:
      ARCH: arm64
    steps:
      - *checkout
      - *free-disk
      - *disk-before
      - *setup-buildx
      - name: Build toolchain image
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/build/docker/Dockerfile.ubuntu
          target: toolchain
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ env.TOOLCHAIN_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/handoff/toolchain.tar
      - *load-toolchain
      - *gcp-auth
      - *start-bazel
      - name: Build gRPC, protobuf and GoogleSQL
        timeout-minutes: 300
        run: |
          docker exec bazel bazel build --config=ci \
            @com_github_grpc_grpc//:grpc++ \
            @com_google_protobuf//:protobuf \
            @com_google_googlesql//googlesql/public:analyzer
          # Flush the disk cache before it is handed off.
          docker exec bazel bazel shutdown
      - *upload-handoff
      - *disk-after

  build-arm64:
    name: Build (arm64)
    needs: deps-arm64
    # Skipped, which the ruleset counts as passing, on pull requests. Elsewhere a
    # failed dependency job must fail this required check rather than skip it.
    if: ${{ !cancelled() && github.ref_type != 'tag' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the Bazel remote cache.
    env:
      ARCH: arm64
    steps:
      - name: Require successful dependency checkpoint
        env:
          DEPS_RESULT: ${{ needs.deps-arm64.result }}
        run: test "$DEPS_RESULT" = success
      - *checkout
      - *free-disk
      - *disk-before
      - &download-handoff
        name: Download toolchain image and Bazel disk cache
        timeout-minutes: 20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-handoff-${{ env.ARCH }}
          path: ${{ runner.temp }}/handoff
      - *load-toolchain
      - *gcp-auth
      - *start-bazel
      - *build-binaries
      - *setup-buildx
      - *build-runtime
      - *smoke-test
      - *upload-runtime
      - *disk-after

  test-shards:
    name: Tests (${{ matrix.area }})
    needs: build-amd64
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      # Disjoint areas plus a complement preserve the upstream suite, including
      # tests added in new packages. Keep the PostgreSQL src exclusion.
      matrix:
        include:
          - area: backend-query
            targets: //backend/query/...
          - area: backend-schema
            targets: //backend/schema/...
          - area: backend-other
            targets: //backend/... -//backend/query/... -//backend/schema/...
          - area: frontend
            targets: //frontend/...
          - area: conformance
            targets: //tests/conformance/...
          - area: postgres-functions
            targets: //third_party/spanner_pg/function_evaluators/...
          - area: postgres-other
            targets: >-
              //third_party/spanner_pg/...
              -//third_party/spanner_pg/src/...
              -//third_party/spanner_pg/function_evaluators/...
          - area: remaining
            targets: >-
              //... -//backend/... -//frontend/...
              -//tests/conformance/... -//third_party/spanner_pg/...
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the Bazel remote cache.
    env:
      ARCH: amd64
    steps:
      - *checkout
      - *free-disk
      - *disk-before
      # Build (amd64)'s toolchain image and local results: whatever it compiled
      # without uploading, no shard compiles again.
      - *download-handoff
      - *load-toolchain
      - *gcp-auth
      - *start-bazel
      - name: Record disk space after loading the handoff
        run: |
          { echo '### After loading the handoff'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run upstream shard
        id: tests
        # 20 min download + 10 load + 285 tests leaves 45 min for setup/logs.
        timeout-minutes: 285
        env:
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          read -r -a targets <<< "$TEST_TARGETS"
          docker exec bazel bazel test --config=ci -- "${targets[@]}" \
            2>&1 | tee "$RUNNER_TEMP/bazel-test-console.log"
      - name: Record disk space after tests
        if: always()
        timeout-minutes: 2
        run: |
          { echo '### After tests (before cleanup)'; echo '```text'; df -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect logs and stop Bazel
        if: always() && steps.tests.outputs.started == 'true'
        timeout-minutes: 5
        run: |
          docker exec bazel cp -rL bazel-testlogs/. /testlogs/ || true
          docker rm --force bazel
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/bazel-testlogs"
      - name: Upload failure logs
        if: failure() || cancelled()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs-${{ matrix.area }}
          path: |
            ${{ runner.temp }}/bazel-testlogs
            ${{ runner.temp }}/bazel-test-console.log
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Upstream unit and conformance tests
    needs: test-shards
    # A failed/skipped matrix must fail this required check, not skip it.
    if: ${{ always() && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success

  publish:
    name: Publish multi-arch image
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.repository == 'stelaxis/cloud-spanner-emulator'
    needs: [build-amd64, build-arm64, unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # Publish the tested images and multi-arch manifest to GHCR.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emulator-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architectures and assemble manifest
        run: |
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/emulator-$arch.tar"
            # Unique staging tags avoid collisions between concurrent releases.
            staging="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "emulator:ci-$arch" "$staging"
            docker push "$staging"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Registry did not return a SHA-256 manifest digest.'
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create \
            --tag "$IMAGE:edge" --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" "${sources[@]}"

  release:
    name: Promote tested image to release tag
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'stelaxis/cloud-spanner-emulator'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # Retag the already-tested registry manifest without running repository code.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote the tested SHA
        run: |
          source="$IMAGE:sha-${GITHUB_SHA:0:7}"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}'); then
            echo '::error::The tested SHA image is missing. Wait for its master build to publish, then rerun this job.'
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Registry did not return a SHA-256 manifest digest.'
            exit 1
          fi
          source="$IMAGE@$digest"
          docker buildx imagetools create --dry-run "$source" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          # Check the full revision too, rather than trusting a short-SHA match.
          while read -r platform_digest; do
            docker buildx imagetools inspect "$IMAGE@$platform_digest" --format '{{json .Image}}' \
              | jq --exit-status --arg sha "$GITHUB_SHA" '.config.Labels["org.opencontainers.image.revision"] == $sha'
          done < <(jq -r '.manifests[].digest' "$RUNNER_TEMP/manifest.json")
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$source"
