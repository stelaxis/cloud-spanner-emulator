name: Emulator image

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*-stx.*']

permissions: {}

env:
  # Generated C++ files can exceed 5 GiB each. Four workers can OOM 16 GiB;
  # leave room for Bazel, linking, and the OS. Keep every cache producer aligned.
  BAZEL_JOBS: '2'
  # Limit each test snapshot to 512 MiB and all cache writes by tests to 8 GiB.
  TEST_CACHE_BYTES: '536870912'
  CACHE_BUDGET_BYTES: '8589934592'

defaults:
  run:
    shell: bash

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rpc-deps:
    name: RPC dependencies (${{ matrix.arch }})
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Checkpoint gRPC and protobuf
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: rpc-deps
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=emulator-rpc-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
          cache-to: type=gha,scope=emulator-rpc-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2,mode=max,timeout=30m,ignore-error=true

  deps:
    name: GoogleSQL dependencies (${{ matrix.arch }})
    needs: rpc-deps
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Checkpoint GoogleSQL value before compiling analyzer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps-value
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=emulator-value-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-rpc-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
          cache-to: type=gha,scope=emulator-value-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2,mode=max,timeout=30m,ignore-error=true
      - name: Checkpoint GoogleSQL before compiling the emulator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=emulator-deps-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-value-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-rpc-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
          cache-to: type=gha,scope=emulator-deps-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2,mode=max,timeout=30m,ignore-error=true

  build:
    name: Build (${{ matrix.arch }})
    needs: deps
    # Required checks must fail, rather than be skipped, if a checkpoint fails.
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Require successful dependency checkpoints
        env:
          DEPS_RESULT: ${{ needs.deps.result }}
        run: test "$DEPS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Native runners only: do not install QEMU. mode=max retains the build
      # stage, including Bazel's expensive GoogleSQL compilation and outputs.
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: linux/${{ matrix.arch }}
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          tags: emulator:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/stelaxis/cloud-spanner-emulator
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/emulator-${{ matrix.arch }}.tar
          cache-from: |
            type=gha,scope=emulator-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-deps-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-value-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-rpc-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2
          cache-to: type=gha,scope=emulator-${{ matrix.arch }}-jobs-${{ env.BAZEL_JOBS }},version=2,mode=max,timeout=30m,ignore-error=true
      - name: Smoke-test native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker load --input "$RUNNER_TEMP/emulator-$ARCH.tar"
          docker run --detach --name emulator --publish 127.0.0.1:9020:9020 "emulator:ci-$ARCH"
          trap 'docker logs emulator; docker rm --force emulator' EXIT
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 10 localhost:9020/v1/projects/test/instances
      # Only runtime images cross into the publishing job; no registry token is
      # available to either the Docker build or pull-request code.
      - name: Upload runtime image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-${{ matrix.arch }}
          path: ${{ runner.temp }}/emulator-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  unit-tests:
    name: Upstream unit and conformance tests
    needs: build
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read # Check available cache space before saving a test snapshot.
    steps:
      - name: Require successful native builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk for Bazel intermediates
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Restore compiled test actions
        id: test-cache
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-test-cache
          # PR retries share one immutable snapshot; master refreshes on each run.
          key: bazel-tests-v2-${{ runner.os }}-${{ runner.arch }}-jobs-${{ env.BAZEL_JOBS }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('master-{0}-{1}', github.run_id, github.run_attempt) }}
          restore-keys: bazel-tests-v2-${{ runner.os }}-${{ runner.arch }}-jobs-${{ env.BAZEL_JOBS }}-master-
      - name: Add test stage to upstream builder
        run: |
          cp build/docker/Dockerfile.ubuntu "$RUNNER_TEMP/Dockerfile.test"
          cat >> "$RUNNER_TEMP/Dockerfile.test" <<'EOF'

          FROM build AS test-builder
          # The full suite includes tests/gcloud, unlike the runtime-only build.
          RUN curl --fail --location --retry 3 \
                https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-586.0.0-linux-x86_64.tar.gz \
                --output /tmp/gcloud.tar.gz \
              && echo '6c774c76793eedd501150b59da653610fbe3eaac169e822965b722de75a2f001  /tmp/gcloud.tar.gz' | sha256sum --check - \
              && tar -xzf /tmp/gcloud.tar.gz -C /opt \
              && rm /tmp/gcloud.tar.gz
          ENV GCLOUD_DIR=/opt/google-cloud-sdk/bin
          RUN /opt/google-cloud-sdk/bin/gcloud version
          EOF
      - name: Load cached builder with test tools
        id: test-builder
        timeout-minutes: 75
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.test
          target: test-builder
          platforms: linux/amd64
          build-args: BAZEL_JOBS=${{ env.BAZEL_JOBS }}
          provenance: false
          sbom: false
          tags: emulator:tests
          load: true
          cache-from: |
            type=gha,scope=emulator-tests-amd64-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-amd64-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-deps-amd64-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-value-amd64-jobs-${{ env.BAZEL_JOBS }},version=2
            type=gha,scope=emulator-rpc-amd64-jobs-${{ env.BAZEL_JOBS }},version=2
          cache-to: type=gha,scope=emulator-tests-amd64-jobs-${{ env.BAZEL_JOBS }},version=2,mode=max,timeout=30m,ignore-error=true
      - name: Explain a failed builder cache load
        if: failure() && steps.test-builder.outcome == 'failure'
        run: |
          echo '::error::Could not load the test builder. The build-stage cache may be missing or evicted; the 75-minute load budget cannot cover a cold rebuild. Check the preceding BuildKit log for cache misses or another build error, then rerun the native build to restore its cache.'
      - name: Run upstream suite inside builder
        id: tests
        # Reserve time to stop the container and save partial compilation/logs.
        timeout-minutes: 225
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bazel-test-cache"
          touch "$RUNNER_TEMP/bazel-test-cache.marker"
          docker run --name emulator-tests \
            --volume "$RUNNER_TEMP/bazel-test-cache:/bazel-cache" \
            emulator:tests bazel test -c opt --jobs="$BAZEL_JOBS" \
              --test_output=errors --nocache_test_results --disk_cache=/bazel-cache \
              -- ... -third_party/spanner_pg/src/... \
            2>&1 | tee "$RUNNER_TEMP/bazel-test-console.log"
      - name: Collect logs and release the test container
        if: always() && steps.tests.outputs.started == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-testlogs"
          if docker container inspect emulator-tests > /dev/null 2>&1; then
            docker stop --time 30 emulator-tests || true
            docker cp -L emulator-tests:/src/bazel-testlogs/. "$RUNNER_TEMP/bazel-testlogs" || true
            docker rm --force emulator-tests
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/bazel-test-cache" "$RUNNER_TEMP/bazel-testlogs"
      - name: Upload failure logs
        if: failure() || cancelled()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs
          path: |
            ${{ runner.temp }}/bazel-testlogs
            ${{ runner.temp }}/bazel-test-console.log
          if-no-files-found: warn
          retention-days: 7
      - name: Prune test cache to this run and its size budget
        id: prune-test-cache
        if: always() && steps.tests.outputs.started == 'true' && steps.test-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          # Bazel 7.6.1 DiskCacheClient.refresh() updates mtime on hits.
          marker="$RUNNER_TEMP/bazel-test-cache.marker"
          test -f "$marker"
          find "$RUNNER_TEMP/bazel-test-cache" -type f ! -newer "$marker" -delete
          find "$RUNNER_TEMP/bazel-test-cache" -type l -delete
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "bazel-test-cache"
          budget = int(os.environ["TEST_CACHE_BYTES"])
          files = sorted(
              ((p.stat().st_mtime_ns, p) for p in root.rglob("*") if p.is_file()),
              reverse=True,
          )
          kept = 0
          for _, path in files:
              # Charge metadata too, so many tiny entries cannot evade the cap.
              size = path.stat().st_size + 4096
              if kept + size <= budget:
                  kept += size
              else:
                  path.unlink()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"bytes={kept}", file=output)
          print(f"Test cache after pruning: {kept} bytes (limit {budget}).")
          PYTHON
          find "$RUNNER_TEMP/bazel-test-cache" -depth -type d -empty -delete
      - name: Check repository cache headroom
        id: cache-headroom
        if: always() && steps.prune-test-cache.outcome == 'success' && steps.prune-test-cache.outputs.bytes != '0'
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          if [[ ! "$used" =~ ^[0-9]+$ ]]; then
            echo '::error::GitHub did not return a valid repository cache size.'
            exit 1
          fi
          # Allow a full snapshot plus archive overhead; failures skip the save.
          if (( used + TEST_CACHE_BYTES + 16777216 <= CACHE_BUDGET_BYTES )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Skipping the test snapshot to protect checkpoint caches: repository cache usage would exceed the 8-GiB budget.'
          fi
          echo "Repository cache usage before test save: $used bytes." >> "$GITHUB_STEP_SUMMARY"
      - name: Save bounded compiled test actions even on failure
        if: always() && steps.cache-headroom.outputs.save == 'true'
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-test-cache
          key: ${{ steps.test-cache.outputs.cache-primary-key }}

  retire-test-caches:
    name: Retire superseded test caches
    needs: unit-tests
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'stelaxis/cloud-spanner-emulator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # Only this isolated master-only job can delete cache entries.
    steps:
      # No checkout, cache restore, or execution of repository code with this token.
      - name: Keep only the newest master test snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=bazel-tests-&per_page=100" \
            --jq '.actions_caches[]' | jq --slurp '
              map(select(.key | startswith("bazel-tests-"))) | sort_by(.created_at) | reverse |
              (map(select(.ref == "refs/heads/master" and (.key | startswith("bazel-tests-v2-")))) | .[0].id) as $keep |
              .[] | select(.id != $keep) | .id
            ' > "$RUNNER_TEMP/obsolete-test-caches"
          while read -r cache_id; do
            if [[ ! "$cache_id" =~ ^[0-9]+$ ]]; then
              echo '::error::Invalid cache ID returned by GitHub.'
              exit 1
            fi
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done < "$RUNNER_TEMP/obsolete-test-caches"

  publish:
    name: Publish multi-arch image
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.repository == 'stelaxis/cloud-spanner-emulator'
    needs: [build, unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # Publish the tested images and multi-arch manifest to GHCR.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emulator-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architectures and assemble manifest
        run: |
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/emulator-$arch.tar"
            # Unique staging tags avoid collisions between concurrent releases.
            staging="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "emulator:ci-$arch" "$staging"
            docker push "$staging"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Registry did not return a SHA-256 manifest digest.'
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create \
            --tag "$IMAGE:edge" --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" "${sources[@]}"

  release:
    name: Promote tested image to release tag
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'stelaxis/cloud-spanner-emulator'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # Retag the already-tested registry manifest without running repository code.
    env:
      IMAGE: ghcr.io/stelaxis/cloud-spanner-emulator
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote the tested SHA
        run: |
          source="$IMAGE:sha-${GITHUB_SHA:0:7}"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}'); then
            echo '::error::The tested SHA image is missing. Wait for its master build to publish, then rerun this job.'
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Registry did not return a SHA-256 manifest digest.'
            exit 1
          fi
          source="$IMAGE@$digest"
          docker buildx imagetools create --dry-run "$source" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          # Check the full revision too, rather than trusting a short-SHA match.
          while read -r platform_digest; do
            docker buildx imagetools inspect "$IMAGE@$platform_digest" --format '{{json .Image}}' \
              | jq --exit-status --arg sha "$GITHUB_SHA" '.config.Labels["org.opencontainers.image.revision"] == $sha'
          done < <(jq -r '.manifests[].digest' "$RUNNER_TEMP/manifest.json")
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$source"
